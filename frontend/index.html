<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="OngekiCollab online rooms and play history from the last 72 hours." />
    <title>OngekiCollab · Online Rooms</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Runs before the bundle so the saved theme paints without a flash; the
      // board page is served without a CSP, unlike the admin page.
      (() => {
        let theme = "dark";
        try {
          const stored = localStorage.getItem("ongeki-collab.theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch { /* Storage unavailable keeps the dark default. */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/board/main.ts"></script>
  </body>
</html>
